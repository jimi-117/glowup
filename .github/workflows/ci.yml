name: GlowCommerce CI

on:
  push:
    branches: [ "main" , "staging", "dev"]
    paths:
      - 'glowcommerce-backend/**'
      - 'glowcommerce-frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" , "staging", "dev"]
    paths:
      - 'glowcommerce-backend/**'
      - 'glowcommerce-frontend/**'
      - '.github/workflows/ci.yml'

jobs:
  # Global security scan with GitGuardian
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitGuardian's scan history
      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GG_API_KEY }}

  # ------------------------- Backend build, test, and SonarCloud scan ------------------------------
  backend-ci:
    needs: security-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./glowcommerce-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        run: mvn -B package # Generates target/classes

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: glowcommerce-backend
          args: >
            -Dsonar.java.binaries=target/classes

  # ------------------------  Build and test for Frontend -------------------------------
  frontend-ci:
    needs: security-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./glowcommerce-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './glowcommerce-frontend/package-lock.json'

      - name: Install and Test
        run: npm ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: glowcommerce-frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------- Build Docker images and scan with Trivy ------------------------------
  container-build:
    needs: [
      backend-ci, 
      frontend-ci
      ] 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: make backend-build

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'glowcommerce-backend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'